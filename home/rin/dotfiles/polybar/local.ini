[module/shades-launcher]
inherit = module/launcher
content = 
content-background = ${color.shade1}
content-foreground = ${color.foreground}
content-padding = 2
click-left = rofi -show drun &
click-right = rofi -show window &

[module/shades-workspaces]
inherit = module/workspaces
icon-0 = 1;󰄰
icon-1 = 2;󰄰
icon-2 = 3;󰄰
icon-3 = 4;󰄰
icon-4 = 5;󰄰
icon-default = 󰄰
label-active = 󰄯
label-empty = 󰄰

[module/terminal]
inherit = module/links
content = 
content-foreground = ${color.foreground-alt}
content-padding = 2
click-left = kitty &

[module/files]
inherit = module/links
content = 
click-left = thunar &

[module/browser]
inherit = module/links
content = 
click-left = zen-beta &

[module/settings]
inherit = module/links
content = 
click-left = pavucontrol &

[module/shades-cpu]
inherit = module/cpu
format-background = ${color.shade8}
format-foreground = ${color.background}
format-prefix = 󰘚

[module/shades-title]
inherit = module/title
format-prefix = 󰛓
; App identity only: window titles can contain private text and oversized emoji.
label = " %class%"

[module/shades-volume]
inherit = module/pulseaudio
sink =
format-volume-background = ${color.shade6}
format-muted-background = ${color.shade6}
click-right = pavucontrol &

format-muted-prefix = 󰖁
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾

; These module names and hook numbers are the eco/performance toggle IPC API.
[module/eco]
type = custom/ipc
hook-0 = if [ "$(eco-mode status)" = on ]; then echo eco; fi
hook-1 = echo eco
initial = 1
format-background = ${color.shade7}
format-foreground = ${color.background}
format-padding = 2
click-left = eco-mode toggle &

[module/performance]
type = custom/ipc
hook-0 = if [ "$(performance-mode status)" = on ]; then echo perf; fi
hook-1 = echo perf
initial = 1
format-background = ${color.shade7}
format-foreground = ${color.background}
format-padding = 2
click-left = performance-mode toggle &

[module/shades-battery]
inherit = module/battery
battery = ${env:POLYBAR_BATTERY:BAT0}
adapter = ${env:POLYBAR_ADAPTER:AC}
label-full = " %percentage%%"
format-full-prefix = 󰂅
ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁻
ramp-capacity-3 = 󰁼
ramp-capacity-4 = 󰁾
ramp-capacity-5 = 󰁿
ramp-capacity-6 = 󰂀
ramp-capacity-7 = 󰂁
ramp-capacity-8 = 󰂂
ramp-capacity-9 = 󰁹
animation-charging-0 = 󰂆
animation-charging-1 = 󰂇
animation-charging-2 = 󰂈
animation-charging-3 = 󰂉
animation-charging-4 = 󰂊
animation-charging-5 = 󰂋
animation-charging-6 = 󰂅

[module/wlan]
inherit = module/network
interface =
interface-type = wireless
label-connected = ${env:POLYBAR_WIFI_LABEL:wifi}
label-disconnected = " Offline"
click-left = kitty --class network -e nmtui &
format-disconnected-prefix = 󰖪
ramp-signal-0 = 󰖩
ramp-signal-1 = 󰖩
ramp-signal-2 = 󰖩

[module/ethernet]
inherit = module/network
interface =
interface-type = wired
format-connected = <label-connected>
format-connected-prefix = "LAN "
label-connected = %local_ip%
format-disconnected =
click-left = kitty --class network -e nmtui &

[module/tray]
type = internal/tray
format-background = ${color.shade3}
tray-background = ${color.shade3}
format-padding = 1
tray-size = 60%
tray-spacing = 6px

[module/shades-power]
inherit = module/sysmenu
content-background = ${color.shade2}
content-foreground = ${color.foreground}
content-padding = 2
click-left = ~/.config/rofi/powermenu.sh &
content = 󰐥
