; shades by adi1090x
include-file = shades/config.ini
include-file = local.ini

[bar/main]
inherit = bar/shades
width = 100%
offset-x = 0
offset-y = 0
font-0 = Fantasque Sans Mono:pixelsize=12;3
; Propo preserves the icon width in GUI rendering; Mono shrinks the symbols.
font-1 = Iosevka Nerd Font Propo:pixelsize=14;4
font-2 = Noto Sans CJK SC:pixelsize=12;3
font-3 = Noto Color Emoji:pixelsize=12;3
modules-left = shades-launcher shades-workspaces terminal files browser settings
modules-center = shades-title
modules-right = shades-cpu eco performance shades-volume shades-battery wlan ethernet date tray shades-power
