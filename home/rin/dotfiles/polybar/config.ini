; Full-width Material bar adapted from adi1090x/polybar-themes.
; Fantasque Sans Mono renders all text; the upstream Material font renders icons.

[colors]
background = #1f1f1f
foreground = #ffffff
foreground-alt = #8f8f8f
module-fg = #1f1f1f
primary = #6f8fa8
secondary = #e53935
alternate = #7cb342

[bar/main]
monitor-strict = false
override-redirect = false
bottom = true
fixed-center = true
width = 100%
height = 40
offset-x = 0
offset-y = 0
background = ${colors.background}
foreground = ${colors.foreground}
border-size = 3
border-color = ${colors.background}
line-size = 2
line-color = ${colors.primary}
padding-left = 1
padding-right = 1
module-margin-left = 1
module-margin-right = 1

; Monospace text, Material icons, and a broad CJK fallback.
font-0 = Fantasque Sans Mono:size=11;2
font-1 = Material\\-Design\\-Iconic\\-Font:size=13;3
font-2 = Noto Sans CJK SC:size=11;2

modules-left = launcher i3 terminal files browser settings
modules-center = xwindow
modules-right = cpu pulseaudio battery wlan ethernet date tray power
separator =
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

[module/launcher]
type = custom/text
format = %{T2}%{T-}
format-background = ${colors.primary}
format-foreground = ${colors.module-fg}
format-padding = 2
click-left = rofi -show drun &

[module/app-button]
type = custom/text
format-foreground = ${colors.foreground-alt}
format-padding = 1

[module/terminal]
inherit = module/app-button
format = %{T2}%{T-}
click-left = kitty &

[module/files]
inherit = module/app-button
format = %{T2}%{T-}
click-left = thunar &

[module/browser]
inherit = module/app-button
format = %{T2}%{T-}
click-left = zen-beta &

[module/settings]
inherit = module/app-button
format = %{T2}%{T-}
click-left = pavucontrol &

[module/i3]
type = internal/i3
pin-workspaces = true
index-sort = true
enable-click = true
enable-scroll = true
wrapping-scroll = false
ws-icon-0 = 1;
ws-icon-1 = 2;
ws-icon-2 = 3;
ws-icon-3 = 4;
ws-icon-4 = 5;
ws-icon-default = 
label-focused = %{T2}%icon%%{T-}
label-focused-foreground = ${colors.primary}
label-focused-underline = ${colors.primary}
label-focused-padding = 2
label-unfocused = %{T2}%icon%%{T-}
label-unfocused-padding = 2
label-visible = %{T2}%icon%%{T-}
label-visible-foreground = ${colors.alternate}
label-visible-padding = 2
label-urgent = %{T2}%icon%%{T-}
label-urgent-foreground = ${colors.secondary}
label-urgent-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:32:...%
label-foreground = ${colors.foreground-alt}

[module/cpu]
type = internal/cpu
interval = 1
format-prefix = "%{T2}%{T-} "
label = %percentage:2%%

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
format-muted = <label-muted>
label-muted = "%{T2}%{T-} Muted"
label-muted-foreground = ${colors.foreground-alt}
ramp-volume-0 = %{T2}%{T-}
ramp-volume-1 = %{T2}%{T-}
ramp-volume-2 = %{T2}%{T-}
click-right = pavucontrol &

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 99
poll-interval = 2
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <label-full>
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = "%{T2}%{T-} 100%"
ramp-capacity-0 = %{T2}%{T-}
ramp-capacity-1 = %{T2}%{T-}
ramp-capacity-2 = %{T2}%{T-}
ramp-capacity-3 = %{T2}%{T-}
ramp-capacity-4 = %{T2}%{T-}
animation-charging-0 = %{T2}%{T-}
animation-charging-1 = %{T2}%{T-}
animation-charging-framerate = 750

[module/network-base]
type = internal/network
interval = 1
accumulate-stats = true
unknown-as-up = true
format-connected = <label-connected>
format-disconnected =
label-connected = "%{T2}%{T-} %local_ip%"

; Show the local address for whichever physical connection is active.
[module/wlan]
inherit = module/network-base
interface-type = wireless

[module/ethernet]
inherit = module/network-base
interface-type = wired

[module/date]
type = internal/date
interval = 1
time = "%%{T2}%%{T-} %I:%M %p"
time-alt = "%%{T2}%%{T-} %a, %d %b %Y"
label = %time%

[module/tray]
type = internal/tray
format-margin = 1
tray-size = 60%
tray-spacing = 6px

[module/power]
type = custom/text
format = %{T2}%{T-}
format-background = ${colors.primary}
format-foreground = ${colors.module-fg}
format-padding = 2
click-left = ~/.config/rofi/powermenu.sh &

[settings]
screenchange-reload = true
pseudo-transparency = false
compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over
