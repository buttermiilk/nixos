backend = "glx";
vsync = true;
xrender-sync-fence = true;

# Keep all managed windows square.
corner-radius = 0;
detect-rounded-corners = false;

# Blur
blur-method = "dual_kawase";
blur-size = 14;
blur-strength = 3;
blur-background = true;
blur-background-frame = false;
blur-kern = "3x3box";
blur-background-exclude = [
  "window_type = 'Polybar'",
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "role = 'xborder'",
  "class_g = 'Conky'",
  "name = 'Notification'",
  "_GTK_FRAME_EXTENTS"
];

# Enable shadows
shadow = true;
shadow-radius = 20;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.8;
shadow-color = "#000000";

shadow-exclude = [
  "class_g =  'Polybar'",
  "class_g =  'Rofi'",
  "name = 'Notification'"
];

# Opacity
inactive-opacity = 0.9;
active-opacity = 1;
