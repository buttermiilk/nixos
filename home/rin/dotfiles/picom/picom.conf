backend = "glx";
vsync = true;
xrender-sync-fence = true;

# Enable the bypass mechanism, but deny it by default in the rules below.
# Only fullscreen osu! stable may bypass compositing.
unredir-if-possible = true;

# Keep all managed windows square.
corner-radius = 0;
detect-rounded-corners = false;

# Blur
blur-method = "dual_kawase";
blur-size = 14;
blur-strength = 3;
blur-background = true;
blur-background-frame = false;
blur-kern = "3x3box";

# Enable shadows
shadow = true;
shadow-radius = 20;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.8;
shadow-color = "#000000";

# Explicit unredir rules also override _NET_WM_BYPASS_COMPOSITOR requests.
# Use the v13 rules API throughout: legacy opacity/exclusion lists are ignored
# when rules are present.
rules = (
  {
    unredir = false;
  },
  {
    match = "!focused && !group_focused && !_NET_WM_WINDOW_OPACITY";
    opacity = 0.9;
  },
  {
    match = "class_g = 'Polybar' || window_type = 'desktop' || window_type = 'dock' || class_g = 'Conky' || name = 'Notification' || _GTK_FRAME_EXTENTS";
    blur-background = false;
  },
  {
    match = "window_type = 'desktop' || class_g = 'Polybar' || class_g = 'Rofi' || name = 'Notification'";
    shadow = false;
  },
  {
    # Match Wine's executable class, not a title containing 'osu!': lazer and
    # browser pages about osu! must retain compositing.
    match = "class_g ?= 'osu!.exe' || class_i ?= 'osu!.exe'";
    opacity = 1.0;
    blur-background = false;
    shadow = false;
    fade = false;
  },
  {
    match = "fullscreen && (class_g ?= 'osu!.exe' || class_i ?= 'osu!.exe')";
    unredir = true;
  }
);
